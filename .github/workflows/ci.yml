name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Go backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: go vet
        run: CGO_ENABLED=1 go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: backend

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race ./...

  # ── Svelte / TypeScript frontend ────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  # ── Whole-stack smoke test ──────────────────────────────────────────────────
  # Builds the real artefact — frontend embedded in the Go binary — and drives
  # the study loop over HTTP, so an embedding or routing regression is caught
  # even though the unit suites pass.
  smoke:
    name: Smoke (embedded binary)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Embed frontend and build binary
        run: |
          cp -r frontend/build/. backend/cmd/server/ui/build/
          cd backend && CGO_ENABLED=1 go build -o /tmp/crapcard-server ./cmd/server

      - name: Study a card end to end
        run: ./scripts/smoke.sh /tmp/crapcard-server
