name: Task
description: A bug, feature, or chore — written so a newcomer (human or agent) could pick it up cold.
title: "[area] "
body:
  - type: markdown
    attributes:
      value: |
        Title the issue with **where** the work happens, not just what — e.g. `[backend/srs] undo loses the learning-step interval`, `[editor] image paste drops alt text`.
        Full guidance: [docs/issue-pr-guidelines.md](../../docs/issue-pr-guidelines.md).
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Chore
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters, in one or two sentences. Agents cannot infer unstated rationale.
      placeholder: e.g. Grading offline then reconnecting replays the outbox out of order, so a card can end up with the wrong FSRS state.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change itself. For bugs — observed vs expected behaviour, and how to reproduce.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable bullets. The issue is done when every box can be ticked.
      placeholder: |
        - [ ] TBC
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover. Keeps the work narrow.
  - type: textarea
    id: pointers
    attributes:
      label: Pointers
      description: Relevant files, docs, test fixtures, or code patterns to follow. Note any CLAUDE.md convention the work touches.
      placeholder: |
        - backend/internal/study/service.go — grading and undo
        - frontend/src/lib/stores/sync.svelte.ts — offline outbox
  - type: textarea
    id: tests
    attributes:
      label: Test expectations
      description: Which test layer this lands in (Go tests in backend/internal/ or backend/cmd/server/, Vitest in frontend/src/, smoke run in scripts/smoke.sh) and what proves it works.
